<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Opleverinspectie">
<title>Opleverinspectie nieuwbouw — Woningstichting Wageningen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="preload" href="fonts/RedditSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="kop" id="kop"></header>
<div id="meldingen" aria-live="polite"></div>
<noscript><p style="padding:20px">Deze app heeft JavaScript nodig.</p></noscript>
<main id="main"><div class="leeg-staat"><strong>Opleverinspectie wordt geladen…</strong></div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* Vangnet voor browsers die de app niet kunnen laden (te oud, geen modules) */
window.addEventListener('error', function (e) {
  if (window.__oiGeladen) return;
  var m = document.getElementById('main');
  if (m) m.innerHTML = '<div class="leeg-staat"><strong>De app kon niet worden geladen</strong><p>' + String(e.message || 'onbekende fout').replace(/</g, '&lt;') + '. Werk iPadOS bij (versie 16 of nieuwer) of open de app in Safari.</p></div>';
});
</script>
<script type="module">window.__oiGeladen = true; import './js/app.js';</script>
</body>
</html>
